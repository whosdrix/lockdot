[package]
name = "lockdot"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Encrypted .env files you can commit to git and share with your team"
license = "MIT"
repository = "https://github.com/whosdrix/lockdot"
homepage = "https://github.com/whosdrix/lockdot"
readme = "README.md"
keywords = ["dotenv", "secrets", "encryption", "age", "cli"]
categories = ["command-line-utilities", "cryptography", "development-tools"]
exclude = ["assets/", ".github/"]

[dependencies]
age = { version = "0.12", features = ["ssh", "armor", "cli-common"] }
anyhow = "1.0.105"
base64 = "0.23"
chacha20poly1305 = "0.11"
clap = { version = "4.6.10", features = ["derive", "env"] }
dirs = "7.0.0"
getrandom = "0.3"
hkdf = "0.13"
hmac = "0.13"
sha2 = "0.11"
tempfile = "3.27.0"
ureq = { version = "3", features = ["platform-verifier"] }
zeroize = "1.9.2"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
proptest = "1.12.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
